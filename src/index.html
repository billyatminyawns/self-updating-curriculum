<title>Self-Updating Curriculum</title>
<meta name="description" content="Drift Inbox: a guided demo of AI agents that find outdated lines in training courses and re-voice the fix in the original narrator's voice. TechLearn 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/*__CSS__*/
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span class="product">Drift Inbox</span><span class="ws">Alder Mutual</span></div>
    <nav class="tabs" aria-label="Sections">
      <button class="tab active" data-view="inbox">Inbox<span class="badge" id="badge"></span></button>
      <button class="tab" data-view="courses">Courses</button>
    </nav>
    <div class="top-right">
      <span class="clock" id="clock"></span>
      <button class="tbtn" id="slack-toggle" title="Slack channel (S)">Slack</button>
      <button class="tbtn" id="how-toggle" title="How the agents work (H)">How it works</button>
      <button class="tbtn icon" id="help" title="Presenter notes (?)" aria-label="Presenter notes">?</button>
      <button class="tbtn icon" id="theme" title="Light / dark (T)" aria-label="Switch light and dark">◐</button>
      <button class="tbtn" id="reset" title="Back to 7:42 AM">Reset</button>
      <span class="avatar" title="Jordan Ellis · Senior Instructional Designer">JE</span>
    </div>
  </header>

  <main class="main">
    <section class="view morning" id="view-morning">
      <div class="morning-card" id="morning-card"></div>
    </section>
    <section class="view inbox" id="view-inbox" hidden>
      <aside class="queue" id="queue" aria-label="Your queue"></aside>
      <article class="review" id="review" aria-live="polite"></article>
    </section>
    <section class="view courses" id="view-courses" hidden>
      <div class="courses-wrap">
        <div class="courses-grid" id="courses-grid"></div>
        <div class="course-detail" id="course-detail"></div>
      </div>
    </section>
  </main>

  <aside class="sheet" id="slack" hidden aria-label="Slack channel">
    <header class="sheet-head"><div><b># ld-content-ops</b><span class="muted" id="sl-members"></span></div><span class="sheet-tag">Slack</span><button class="tbtn icon" data-close="slack" aria-label="Close">×</button></header>
    <div class="sl-connect" id="sl-connect"></div>
    <div class="sl-msgs" id="sl-msgs"></div>
    <div class="sl-composer"><span>Message #ld-content-ops</span></div>
  </aside>

  <aside class="sheet" id="how" hidden aria-label="How it works">
    <header class="sheet-head"><div><b>How it works</b><span class="muted">six agents, one human</span></div><button class="tbtn icon" data-close="how" aria-label="Close">×</button></header>
    <div class="how-body" id="how-body"></div>
  </aside>

  <div class="toast" id="toast" hidden></div>
  <div class="modal" id="help-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div class="modal-head"><h2 id="help-title">Presenter notes</h2><button class="tbtn icon" id="help-close" aria-label="Close">×</button></div>
      <div class="modal-body" id="help-body"></div>
    </div>
  </div>
</div>

<script id="content-data" type="application/json">/*__CONTENT__*/</script>
<script id="audio-data" type="application/json">/*__AUDIO__*/</script>
<script>
/*__JS__*/
</script>
